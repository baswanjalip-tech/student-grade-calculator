<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .head{
            position: relative;
            left: 70px;
            left: 35px;
            height: 90px;
            width: calc(100vw - 70px);
            background-color: rgb(122, 26, 122);
            color: white;
            border-radius: 15px;
        }
        .head h1{
            position: absolute;
            top: 20px;
            left: 470px;
        }
        .head p{
            position: absolute;
            top: 55px;
            left: 530px;
            color: rgb(216, 197, 235);
        }
        input{
            height: 35px;
            width: 500px;
            margin-bottom: 15px;
            border-radius: 10px;
            font-family: 'Times New Roman', Times, serif;
            font-size: 16px;
            margin-left: 15px;
            border: 2px solid white;
            border: none;
            outline: none;
        }
        input:focus{
            border: 0.5px solid black;
        }
        input:hover{
            box-shadow: 0 0 0 5px blue;
        }
        label{
            margin-left: 15px;
            margin-bottom: 5px;
        }
        .report{
            position: relative;
            display: grid;
            justify-content: center;
            align-items: center;
            height: 500px;
            width: 550px;
            background-color: aliceblue;
            border-radius: 15px;
            left: 400px;
            top: 20px;
        }
        
    </style>
</head>
<body>
    <div class="head">
        <h1>Student Grade Calculator</h1>
        <p>Calculate your marks and grade</p>
    </div>
    <form action="#">
        <div class="report">
            <div>
            <label for="text"><b>Mathematics:</b></label>
            <input type="text" placeholder="Enter your marks">
        </div>
        <div>
            <label for="text"><b>Physics:</b></label>
            <input type="text" placeholder="Enter your marks">
        </div>
        <div>
            <label for="text"><b>Chemistry:</b></label>
            <input type="text" placeholder="Enter your marks">
        </div>
        <div>
            <label for="text"><b>Biology:</b></label>
            <input type="text" placeholder="Enter your marks">
        </div>
        <div>
            <label for="text"><b>English:</b></label>
            <input type="text" placeholder="Enter your marks">
        </div>
        <div>
            <label for="text"><b>Kannada:</b></label>
            <input type="text" placeholder="Enter your marks">
        </div>
    </div>
        
    </form>
</body>
</html>
